services:
  - type: web
    name: haxbort
    runtime: node
    plan: free
    # Virginia: la región de Render más cercana a Argentina (para el relay y las salas en el servidor).
    region: virginia
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base de datos de los torneos (Neon). El valor se carga a mano en Render → Environment.
      - key: DATABASE_URL
        sync: false
      # Relevo TURN de Cloudflare Realtime (para redes donde las compus no se conectan directo).
      # Se cargan a mano en Render → Environment.
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
